name: Build PSSAB Android APK v5

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Android project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP proyek Android belum ditemukan."
            exit 1
          fi
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$PROJECT_ZIP" -d android_project

          PROJECT_DIR=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            exit 1
          fi

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./

      - name: Set application name
        shell: bash
        run: |
          STRINGS=$(find app/src/main/res -type f \
            -path "*/values/strings.xml" -print -quit 2>/dev/null || true)

          if [ -n "$STRINGS" ]; then
            if grep -q 'name="app_name"' "$STRINGS"; then
              sed -i -E \
                's#<string name="app_name"[^>]*>.*</string>#<string name="app_name">PSSAB Tanjung Uncang</string>#' \
                "$STRINGS"
            else
              sed -i '/<\/resources>/i\    <string name="app_name">PSSAB Tanjung Uncang</string>' "$STRINGS"
            fi
          else
            mkdir -p app/src/main/res/values
            printf '%s\n' \
              '<resources>' \
              '    <string name="app_name">PSSAB Tanjung Uncang</string>' \
              '</resources>' > app/src/main/res/values/strings.xml
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i -E \
              's/android:label="[^"]*"/android:label="@string\/app_name"/' \
              "$MANIFEST"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Restore PSSAB signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 belum dibuat."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > PSSAB-release-v3.jks
          ls -lh PSSAB-release-v3.jks

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$APK" \
            app/build/outputs/apk/release/aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks PSSAB-release-v3.jks \
            --ks-key-alias pssab \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/release/PSSAB-Tanjung-Uncang.apk \
            app/build/outputs/apk/release/aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/PSSAB-Tanjung-Uncang.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pssab-tanjung-uncang-apk-v5
          path: app/build/outputs/apk/release/PSSAB-Tanjung-Uncang.apk
          if-no-files-found: error
