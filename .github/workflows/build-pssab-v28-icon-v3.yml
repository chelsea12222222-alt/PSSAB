name: Build PSSAB v28 APK - Icon Besar v3

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: ZIP project Android PSSAB belum ditemukan di root repository.'
            exit 1
          fi
          echo "ZIP ditemukan: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$PROJECT_ZIP" -d android_project
          PROJECT_DIR=$(find android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle tidak ditemukan di ZIP project.'
            exit 1
          fi
          echo "Project Android: $PROJECT_DIR"
          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./
          chmod +x ./gradlew 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-v28-Icon-Besar-v3
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
