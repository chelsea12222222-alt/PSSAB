name: Build PSSAB v28 APK - Icon Besar v5

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f \( -iname 'PSSAB_ANDROID_PROJECT_ICON_V3.zip' -o -iname 'PSSAB_Tanjung_Uncang_ANDROID_PLAY_v1.zip' -o -iname '*.zip' \) -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: File project Android ZIP tidak ditemukan."
            exit 1
          fi
          echo "ZIP ditemukan: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$PROJECT_ZIP" -d android_project
          PROJECT_DIR=$(find android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan di dalam ZIP."
            find android_project -maxdepth 5 -type f | head -100
            exit 1
          fi
          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-v28-Icon-Besar-v5
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
