name: Build PSSAB Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP proyek Android belum ditemukan di repository."
            exit 1
          fi
          echo "Menggunakan: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android_project
          mkdir android_project
          unzip -q "$PROJECT_ZIP" -d android_project

          PROJECT_DIR=$(find android_project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi

          echo "Project Android: $PROJECT_DIR"
          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./

          test -f settings.gradle || (echo "ERROR: settings.gradle tidak berada di root setelah extract."; exit 1)
          test -f app/build.gradle || (echo "ERROR: app/build.gradle tidak ditemukan."; exit 1)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: gradle-version: '9.5'
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android App Bundle
        run: gradle :app:bundleRelease --no-daemon

      - name: Show AAB result
        run: ls -lh app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pssab-tanjung-uncang-aab
          path: ild/outputs/bundle/release/app-release.aab
          if-no-files-found: error
