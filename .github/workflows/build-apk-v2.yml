name: Build PSSAB Android APK v2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP proyek Android tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$PROJECT_ZIP" -d android_project

          PROJECT_DIR=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
            find android_project -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "Project Android ditemukan di: $PROJECT_DIR"

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan di root proyek setelah ekstraksi."
            find . -maxdepth 3 -type f -name "gradlew" -print
            exit 1
          fi

          chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon

      - name: Show APK result
        shell: bash
        run: |
          echo "APK berhasil dibuat:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pssab-tanjung-uncang-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
