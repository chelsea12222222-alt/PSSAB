name: Build PSSAB v28 APK Signed v15 - Icon Besar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f \( \
            -iname 'PSSAB_ANDROID_PROJECT_ICON_V3.zip' -o \
            -iname 'PSSAB_Tanjung_Uncang_ANDROID_PLAY_v1.zip' -o \
            -iname '*.zip' \
          \) -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project Android ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$PROJECT_ZIP" -d android_project

          PROJECT_DIR=$(find android_project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
            find android_project -maxdepth 5 -type f | head -100
            exit 1
          fi

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore PSSAB signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/PSSAB-release-v3.jks
          test -s keystore/PSSAB-release-v3.jks
          chmod 600 keystore/PSSAB-release-v3.jks

      - name: Set PSSAB release version 15
        shell: bash
        run: |
          set -e
          FILE="app/build.gradle"
          if [ ! -f "$FILE" ]; then
            FILE="app/build.gradle.kts"
          fi

          echo "Gradle file: $FILE"

          python3 - "$FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          # Keep the same applicationId. Only advance the version so this
          # signed APK can upgrade the existing PSSAB v14 installation.
          s2 = re.sub(r'versionCode\s+\d+', 'versionCode 15', s, count=1)
          s2 = re.sub(r'versionName\s+[\'"][^\'"]+[\'"]', "versionName '28.0.15'", s2, count=1)

          if s2 == s:
              raise SystemExit("Could not find versionCode/versionName in app Gradle file.")

          open(p, "w", encoding="utf-8").write(s2)
          PY

          grep -n "applicationId\|versionCode\|versionName" "$FILE"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk || \
            test -f app/build/outputs/apk/release/app-release.apk

      - name: Sign APK with the existing PSSAB keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tidak ditemukan."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/PSSAB-Tanjung-Uncang-v15-SIGNED.apk

          "$APKSIGNER" sign \
            --ks keystore/PSSAB-release-v3.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out dist/PSSAB-Tanjung-Uncang-v15-SIGNED.apk \
            dist/PSSAB-Tanjung-Uncang-v15-SIGNED.apk

          "$APKSIGNER" verify --verbose dist/PSSAB-Tanjung-Uncang-v15-SIGNED.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v15-SIGNED
          path: dist/PSSAB-Tanjung-Uncang-v15-SIGNED.apk
          if-no-files-found: error
