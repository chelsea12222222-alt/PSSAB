name: Build PSSAB Android APK Release v7
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/pssab/tanjunguncang app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name="PSSABAndroid"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.pssab.tanjunguncang'
            compileSdk 35
            defaultConfig {
              applicationId 'com.pssab.tanjunguncang'
              minSdk 23
              targetSdk 35
              versionCode 7
              versionName '7.0'
            }
            buildTypes { release { minifyEnabled false; shrinkResources false } }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <application android:allowBackup="false" android:hardwareAccelerated="true" android:label="PSSAB TANJUNG UNCANG" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;
          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          public class MainActivity extends Activity {
            WebView w;
            public void onCreate(Bundle b) {
              super.onCreate(b); w=new WebView(this); setContentView(w);
              WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient(){ public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}});
              if(ContextCompat.checkSelfPermission(this,Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED) ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.CAMERA},1001);
              w.loadUrl("https://pssab-v28.chelsea12222222.workers.dev/");
            }
            @Override public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();}
          }
          EOF
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Ucang-release-v7
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
