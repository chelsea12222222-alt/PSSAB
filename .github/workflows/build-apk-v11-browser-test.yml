name: Build PSSAB APK v11 Browser Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create minimal Android project
        shell: bash
        run: |
          set -e

          rm -rf pssab-android
          mkdir -p pssab-android/app/src/main/java/com/pssab/tanjunguncang
          mkdir -p pssab-android/app/src/main/res/values

          cat > pssab-android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PSSAB'
          include ':app'
          EOF

          cat > pssab-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > pssab-android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pssab.tanjunguncang'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pssab.tanjunguncang'
                  minSdk 23
                  targetSdk 35
                  versionCode 11
                  versionName '28.0.11'
              }
          }
          EOF

          cat > pssab-android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">PSSAB TANJUNG UNCANG</string>
          </resources>
          EOF

          cat > pssab-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > pssab-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > pssab-android/app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String PSSAB_URL =
                      "https://pssab-v28.chelsea12222222.workers.dev/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(PSSAB_URL));
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "Browser tidak tersedia. Silakan buka PSSAB melalui Chrome.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }
          }
          EOF

          cd pssab-android

          gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build APK
        working-directory: pssab-android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp pssab-android/app/build/outputs/apk/debug/app-debug.apk \
             PSSAB-Tanjung-Uncang-v11-browser-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v11-browser-test
          path: PSSAB-Tanjung-Uncang-v11-browser-test.apk
