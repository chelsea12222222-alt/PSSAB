name: Build PSSAB APK Signed v16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f settings.gradle build.gradle gradle.properties

          mkdir -p app/src/main/java/com/pssab/tanjunguncang
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'PSSAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pssab.tanjunguncang'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pssab.tanjunguncang'
                  minSdk 23
                  targetSdk 35
                  versionCode 16
                  versionName '28.0.16'
              }

              signingConfigs {
                  release {
                      storeFile file("$rootProject.projectDir/keystore/PSSAB-release-v3.jks")
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias 'pssab'
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">PSSAB Tanjung Uncang</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="pssab_background">#24100D</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#9E0B12</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#24100D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private static final int CAMERA_PERMISSION = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.CAMERA)
                                      == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION
                      );
                  }

                  webView.loadUrl(
                          "https://pssab-v28.chelsea12222222.workers.dev"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create AndroidManifest
        shell: bash
        run: |
          set -e

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.INTERNET"/>' \
          '    <uses-permission android:name="android.permission.CAMERA"/>' \
          '    <application' \
          '        android:theme="@style/AppTheme"' \
          '        android:label="@string/app_name"' \
          '        android:icon="@mipmap/ic_launcher"' \
          '        android:roundIcon="@mipmap/ic_launcher"' \
          '        android:usesCleartextTraffic="false"' \
          '        android:hardwareAccelerated="true">' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="portrait"' \
          '            android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN"/>' \
          '                <category android:name="android.intent.category.LAUNCHER"/>' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          test -s app/src/main/AndroidManifest.xml

      - name: Prepare PSSAB logo
        shell: bash
        run: |
          set -e

          LOGO="$(find . -maxdepth 3 -type f \
            \( -iname 'Logo PSSAB.png' -o -iname 'pssab_logo.png' \) \
            -print -quit)"

          if [ -z "$LOGO" ]; then
            echo "ERROR: Logo PSSAB tidak ditemukan."
            exit 1
          fi

          cp "$LOGO" app/src/main/res/drawable/pssab_logo.png

          test -s app/src/main/res/drawable/pssab_logo.png

          echo "Logo ditemukan:"
          echo "$LOGO"

      - name: Create large adaptive launcher icon
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap

          cp app/src/main/res/drawable/pssab_logo.png \
             app/src/main/res/mipmap/ic_launcher.png

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#24100D"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item
                  android:left="-18dp"
                  android:top="-18dp"
                  android:right="-18dp"
                  android:bottom="-18dp">

                  <bitmap
                      android:src="@drawable/pssab_logo"
                      android:gravity="fill" />

              </item>

          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          echo "Adaptive icon PSSAB berhasil dibuat."

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          mkdir -p keystore

          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > keystore/PSSAB-release-v3.jks

          test -s keystore/PSSAB-release-v3.jks

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/pssab/tanjunguncang/MainActivity.java
          test -s app/src/main/res/drawable/pssab_logo.png
          test -s app/src/main/res/mipmap/ic_launcher.png
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          echo "Semua file proyek tersedia."

      - name: Build signed APK v16
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | sort -V | tail -1)

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Rename APK
        shell: bash
        run: |
          set -e

          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PSSAB-Tanjung-Uncang-v16.apk

      - name: Upload PSSAB APK v16
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v16-SIGNED
          path: app/build/outputs/apk/release/PSSAB-Tanjung-Uncang-v16.apk
          if-no-files-found: error
