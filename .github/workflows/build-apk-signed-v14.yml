name: Build PSSAB APK Signed v14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/pssab/tanjunguncang
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = 'PSSAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.pssab.tanjunguncang'
            compileSdk 35

            defaultConfig {
              applicationId 'com.pssab.tanjunguncang'
              minSdk 23
              targetSdk 35
              versionCode 14
              versionName '28.0.14'
            }

            signingConfigs {
              release {
                storeFile file("$rootDir/keystore/PSSAB-release-v3.jks")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'pssab'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
              }
            }

            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
          }

          dependencies {
           implementation 'androidx.appcompat:appcompat:1.7.0'
           implementation 'androidx.webkit:webkit:1.12.1'

           implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">PSSAB Tanjung Uncang</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
            <color name="pssab_green">#72D6A1</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/pssab_fallback.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

            <path
                android:fillColor="#72D6A1"
                android:pathData="M0,0h108v108h-108z"/>

            <path
                android:fillColor="#FFFFFF"
                android:pathData="M28,24h42c12,0 20,7 20,18s-8,18 -20,18H43v24H28zM43,36v12h25c4,0 7,-2 7,-6s-3,-6 -7,-6z"/>
          </vector>
          EOF

          cp app/src/main/res/drawable/pssab_fallback.xml \
             app/src/main/res/drawable/pssab_logo.xml

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/pssab_green"/>
            <foreground android:drawable="@drawable/pssab_logo"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/drawable/pssab_fallback.xml \
             app/src/main/res/mipmap/ic_launcher.xml

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

            <application
                android:theme="@style/AppTheme"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="false"
                android:hardwareAccelerated="true">

              <activity
                  android:name=".MainActivity"
                  android:screenOrientation="portrait"
                  android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:colorAccent">#72D6A1</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

            private WebView webView;
            private static final int CAMERA_REQ = 1001;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);

              webView = new WebView(this);
              setContentView(webView);

              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);

              webView.setWebViewClient(new WebViewClient());

              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest r) {
                  runOnUiThread(() -> {
                    if (checkSelfPermission(Manifest.permission.CAMERA)
                        != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.CAMERA},
                          CAMERA_REQ);

                    } else {
                      r.grant(r.getResources());
                    }
                  });
                }
              });

              if (checkSelfPermission(Manifest.permission.CAMERA)
                  != PackageManager.PERMISSION_GRANTED) {

                requestPermissions(
                    new String[]{Manifest.permission.CAMERA},
                    CAMERA_REQ);
              }

              webView.loadUrl(
                  "https://pssab-v28.chelsea12222222.workers.dev");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

      - name: Recover original PSSAB logo
        shell: bash
        run: |
          set -e

          OLD="$(git show HEAD^:.github/workflows/build-apk-signed-v14.yml 2>/dev/null || true)"

          B64="$(printf '%s\n' "$OLD" | \
            sed -n "/echo 'iVBORw0KGgo/ {
              s/.*echo '\\([^']*\\)'.*/\\1/p
            }")"

          if [ -n "$B64" ]; then
            rm -f app/src/main/res/drawable/pssab_logo.xml
            printf '%s' "$B64" | base64 -d \
              > app/src/main/res/drawable/pssab_logo.png

            echo "Logo PSSAB lama berhasil dipulihkan."
          else
            echo "Logo lama tidak ditemukan; memakai logo cadangan."
          fi

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          mkdir -p keystore

          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > keystore/PSSAB-release-v3.jks

          test -s keystore/PSSAB-release-v3.jks

      - name: Build signed APK v14
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | sort -V | tail -1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose "$APK"

          "$BUILD_TOOLS/apksigner" verify \
            --print-certs "$APK"

      - name: Upload PSSAB APK v14
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v14-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
