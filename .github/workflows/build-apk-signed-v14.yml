name: Build PSSAB APK Signed v14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/pssab/tanjunguncang
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name='PSSAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          configurations.all {
            resolutionStrategy.eachDependency { details ->
              if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
              }
            }
          }

          android {
            namespace 'com.pssab.tanjunguncang'
            compileSdk 35

            defaultConfig {
              applicationId 'com.pssab.tanjunguncang'
              minSdk 23
              targetSdk 35
              versionCode 14
              versionName '28.0.14'
            }

            signingConfigs {
              release {
                storeFile file('keystore/PSSAB-release-v3.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }

            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">PSSAB TANJUNG UNCANG</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          EOF

          # The original PSSAB logo is embedded here, with transparent corners.
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/pssab_logo.png
          cp app/src/main/res/drawable-nodpi/pssab_logo.png app/src/main/res/mipmap/ic_launcher.png

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/pssab_logo"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>

            <application
              android:theme="@style/AppTheme"
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:usesCleartextTraffic="false"
              android:hardwareAccelerated="true">
              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends Activity {
            private WebView w;
            private static final int CAMERA_REQ = 1001;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);

              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);

              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest r) {
                  runOnUiThread(() -> {
                    if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                        != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(MainActivity.this,
                          new String[]{Manifest.permission.CAMERA}, CAMERA_REQ);
                    } else {
                      r.grant(r.getResources());
                    }
                  });
                }
              });

              w.loadUrl("https://pssab-v28.chelsea12222222.workers.dev/");
            }

            @Override
            public void onBackPressed() {
              if (w != null && w.canGoBack()) w.goBack();
              else super.onBackPressed();
            }
          }
          EOF

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "${{ secrets.KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.KEY_ALIAS }}"
          test -n "${{ secrets.KEY_PASSWORD }}"
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/PSSAB-release-v3.jks
          test -s app/keystore/PSSAB-release-v3.jks

      - name: Build signed APK v14
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Upload PSSAB APK v14
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v14-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
