name: Build PSSAB APK Signed v14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/pssab/tanjunguncang
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'PSSAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pssab.tanjunguncang'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pssab.tanjunguncang'
                  minSdk 23
                  targetSdk 35
                  versionCode 14
                  versionName '28.0.14'
              }

              signingConfigs {
                  release {
                      storeFile file("$rootProject.projectDir/keystore/PSSAB-release-v3.jks")
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias 'pssab'
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">PSSAB Tanjung Uncang</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#72D6A1</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pssab/tanjunguncang/MainActivity.java <<'EOF'
          package com.pssab.tanjunguncang;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private static final int CAMERA_REQ = 1001;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest r) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.CAMERA)
                                      != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(
                                      new String[]{Manifest.permission.CAMERA},
                                      CAMERA_REQ
                                  );
                              } else {
                                  r.grant(r.getResources());
                              }
                          });
                      }
                  });

                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.CAMERA},
                          CAMERA_REQ
                      );
                  }

                  webView.loadUrl(
                      "https://pssab-v28.chelsea12222222.workers.dev"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create AndroidManifest
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.INTERNET"/>' \
          '    <uses-permission android:name="android.permission.CAMERA"/>' \
          '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
          '' \
          '    <application' \
          '        android:theme="@style/AppTheme"' \
          '        android:label="@string/app_name"' \
          '        android:icon="@drawable/pssab_logo"' \
          '        android:roundIcon="@drawable/pssab_logo"' \
          '        android:usesCleartextTraffic="false"' \
          '        android:hardwareAccelerated="true">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="portrait"' \
          '            android:exported="true">' \
          '' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN"/>' \
          '                <category android:name="android.intent.category.LAUNCHER"/>' \
          '            </intent-filter>' \
          '' \
          '        </activity>' \
          '' \
          '    </application>' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          test -f app/src/main/AndroidManifest.xml
          echo "AndroidManifest.xml berhasil dibuat."

      - name: Prepare PSSAB logo
        shell: bash
        run: |
          set -e

          LOGO="Logo PSSAB.png"

          if [ ! -f "$LOGO" ]; then
              echo "ERROR: Logo PSSAB.png tidak ditemukan di repository."
              echo "File yang tersedia:"
              find . -maxdepth 2 -type f | head -50
              exit 1
          fi

          cp "$LOGO" app/src/main/res/drawable/pssab_logo.png

          test -s app/src/main/res/drawable/pssab_logo.png

          echo "Logo PSSAB asli berhasil dipasang."

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          mkdir -p keystore

          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > keystore/PSSAB-release-v3.jks

          test -s keystore/PSSAB-release-v3.jks

          echo "Signing key siap."

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Memeriksa file Android..."

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pssab/tanjunguncang/MainActivity.java
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/drawable/pssab_logo.png
          test -f keystore/PSSAB-release-v3.jks

          echo "Semua file utama tersedia."

      - name: Build signed APK v14
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | sort -V | tail -1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify \
            --print-certs \
            "$APK"

          echo "APK berhasil dibuat dan tanda tangan berhasil diverifikasi."

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mv \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/PSSAB-Tanjung-Uncang-v14-SIGNED.apk

          test -f \
            app/build/outputs/apk/release/PSSAB-Tanjung-Uncang-v14-SIGNED.apk

      - name: Upload PSSAB APK v14
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Tanjung-Uncang-v14-SIGNED
          path: app/build/outputs/apk/release/PSSAB-Tanjung-Uncang-v14-SIGNED.apk
          if-no-files-found: error
