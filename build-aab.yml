name: Build PSSAB Android AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP proyek Android belum ditemukan di repository."
            exit 1
          fi
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP ditemukan: $ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$PROJECT_ZIP" -d android_project

          PROJECT_DIR=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
            find android_project -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "Project Android: $PROJECT_DIR"
          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. ./

          test -f settings.gradle || test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle atau settings.gradle.kts tidak ditemukan di root proyek."
            exit 1
          }

          test -f app/build.gradle || test -f app/build.gradle.kts || {
            echo "ERROR: app/build.gradle atau app/build.gradle.kts tidak ditemukan."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"

      - name: Build Android App Bundle
        run: gradle :app:bundleRelease --no-daemon

      - name: Show AAB result
        run: |
          echo "AAB berhasil dibuat:"
          ls -lh app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pssab-tanjung-uncang-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
